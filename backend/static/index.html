    <script>
      try {
        const savedTheme = localStorage.getItem("tomato_hmi_theme");
        const dark = savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
